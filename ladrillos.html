<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0712">
<title>NULL · Ladrillos</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0712; color: #e9e4f5;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #0f0a18; border: 1px solid #2a1f3d; border-radius: 12px; box-shadow: 0 0 40px rgba(139,92,246,.18); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
// NULL · Arcade — utilidades compartidas por todos los juegos
const W = 360, H = 640
const MORADO = '#8b5cf6', CIAN = '#22d3ee', ROJO = '#f43f5e', ROJO2 = '#e11d48', ORO = '#fbbf24', VERDE = '#34d399', GRIS = '#b8b0cc', GRIS2 = '#8a80a6'
const c = document.getElementById('c')
const x = c.getContext('2d')

function ajustar() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98
  const dpr = Math.min(window.devicePixelRatio || 1, 2)
  c.style.width = Math.floor(W * s) + 'px'
  c.style.height = Math.floor(H * s) + 'px'
  c.width = Math.floor(W * s * dpr)
  c.height = Math.floor(H * s * dpr)
  x.setTransform(c.width / W, 0, 0, c.height / H, 0, 0)
}
addEventListener('resize', ajustar)
ajustar()

// Piloto que manda el bot (?n=Nombre)
let piloto = ''
try { piloto = (new URLSearchParams(location.search).get('n') || '').replace(/[\u0000-\u001f]/g, '').slice(0, 18) } catch (e) {}

// Coordenadas del toque dentro del lienzo
function enLienzo(e) {
  const r = c.getBoundingClientRect()
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }
}

function texto(s, px, py, tam, col, peso = '700', alin = 'center') {
  x.font = peso + ' ' + tam + 'px ui-monospace, Menlo, Consolas, monospace'
  x.fillStyle = col; x.textAlign = alin; x.fillText(s, px, py)
}

// Sonido
let actx
function initAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)()
    if (actx.state === 'suspended') actx.resume()
  } catch (e) {}
}
function tono(f1, f2, tipo, dur, vol = 0.08) {
  if (!actx) return
  try {
    const o = actx.createOscillator(), g = actx.createGain()
    o.type = tipo
    o.frequency.setValueAtTime(f1, actx.currentTime)
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime + dur)
    g.gain.setValueAtTime(vol, actx.currentTime)
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur)
    o.connect(g); g.connect(actx.destination)
    o.start(); o.stop(actx.currentTime + dur)
  } catch (e) {}
}

// Récord por juego
function leerRecord(k) { try { return parseInt(localStorage.getItem('null_rec_' + k) || '0', 10) || 0 } catch (e) { return 0 } }
function guardarRecord(k, v) { try { localStorage.setItem('null_rec_' + k, String(Math.floor(v))) } catch (e) {} }

// Botón "← JUEGOS" (abajo, en menú y fin)
const VOLVER = { x: W / 2 - 60, y: H - 62, w: 120, h: 34 }
function dibujarVolver() {
  x.strokeStyle = '#3a2d55'; x.lineWidth = 1.5
  x.beginPath(); x.roundRect ? x.roundRect(VOLVER.x, VOLVER.y, VOLVER.w, VOLVER.h, 8) : x.rect(VOLVER.x, VOLVER.y, VOLVER.w, VOLVER.h); x.stroke()
  texto('← JUEGOS', W / 2, VOLVER.y + 22, 13, GRIS, '700')
}
function tocaVolver(p) { return p.x > VOLVER.x && p.x < VOLVER.x + VOLVER.w && p.y > VOLVER.y && p.y < VOLVER.y + VOLVER.h }
function volver() { location.href = 'index.html' + location.search }

// Fondo de estrellas
const estrellas = []
for (let i = 0; i < 60; i++) estrellas.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.6, vy: 0.6 + Math.random() * 2 })
function moverEstrellas(dt, f = 1) { estrellas.forEach(s => { s.y += s.vy * dt * f; if (s.y > H) { s.y = 0; s.x = Math.random() * W } }) }
function dibujarEstrellas() { estrellas.forEach(s => { x.fillStyle = 'rgba(200,190,255,' + (s.r * 0.22) + ')'; x.fillRect(s.x, s.y, s.r, s.r) }) }

// Pantallas comunes
function pantallaMenu(titulo, lineas, rec, t) {
  x.fillStyle = 'rgba(11,7,18,.6)'; x.fillRect(0, 0, W, H)
  texto('N U L L', W / 2, 190, 34, '#ffffff', '900')
  texto('— ' + titulo + ' —', W / 2, 222, 14, MORADO, '700')
  if (piloto) texto('Piloto: ' + piloto, W / 2, 268, 14, CIAN, '700')
  lineas.forEach((l, i) => texto(l, W / 2, 340 + i * 22, 13, GRIS, '400'))
  if (rec) texto('Tu récord: ' + Math.floor(rec), W / 2, 490, 13, GRIS2, '700')
  if (Math.floor(t / 30) % 2 === 0) texto('TOCA PARA EMPEZAR', W / 2, 535, 16, '#ffffff', '900')
  dibujarVolver()
}
function pantallaFin(titulo, puntos, extra, nuevo, rec, listo, t) {
  x.fillStyle = 'rgba(11,7,18,.82)'; x.fillRect(0, 0, W, H)
  texto(titulo, W / 2, 230, 30, ROJO, '900')
  texto(String(Math.floor(puntos)), W / 2, 295, 44, '#ffffff', '900')
  if (extra) texto(extra, W / 2, 322, 13, GRIS, '400')
  if (nuevo) texto('¡NUEVO RÉCORD!', W / 2, 365, 16, ORO, '900')
  else texto('Récord: ' + Math.floor(rec), W / 2, 365, 13, GRIS2, '700')
  const conCodigo = dibujarCodigo(puntos)
  if (listo && Math.floor(t / 30) % 2 === 0) texto('TOCA PARA REINTENTAR', W / 2, conCodigo ? 505 : 450, 15, '#ffffff', '900')
  dibujarVolver()
}
function pantallaPausa() {
  x.fillStyle = 'rgba(11,7,18,.75)'; x.fillRect(0, 0, W, H)
  texto('PAUSA', W / 2, H / 2 - 10, 28, '#ffffff', '900')
  texto('Toca para seguir', W / 2, H / 2 + 22, 13, GRIS, '400')
}

// Deslizar (para serpiente y 2048)
function alDeslizar(fn) {
  let ini = null
  c.addEventListener('pointerdown', e => { ini = { x: e.clientX, y: e.clientY } })
  c.addEventListener('pointerup', e => {
    if (!ini) return
    const dx = e.clientX - ini.x, dy = e.clientY - ini.y
    ini = null
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return
    if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'der' : 'izq')
    else fn(dy > 0 ? 'abajo' : 'arriba')
  })
  addEventListener('keydown', e => {
    const m = { ArrowLeft: 'izq', ArrowRight: 'der', ArrowUp: 'arriba', ArrowDown: 'abajo', KeyA: 'izq', KeyD: 'der', KeyW: 'arriba', KeyS: 'abajo' }
    if (m[e.code]) { e.preventDefault(); fn(m[e.code]) }
  })
}

// ===== Código para cobrar en Null =====
let boleto = ''
try { boleto = (new URLSearchParams(location.search).get('t') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10) } catch (e) {}
const LETRA = { nave: 'N', serpiente: 'S', aleteo: 'A', ladrillos: 'L', '2048': 'D' }
let mejorSesion = 0, copiadoHasta = 0
function huella(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0 } return h >>> 0 }
function firma(tk, j, p) { return huella('null-arcade-v1|' + tk + '|' + j + '|' + p).toString(36).toUpperCase().padStart(7, '0').slice(-5) }
function codigoDe(p) { const j = LETRA[JUEGO]; return j + '-' + p + '-' + firma(boleto, j, p) }
const CAJA = { x: W / 2 - 130, y: 392, w: 260, h: 64 }
function tocaCodigo(p) { return !!boleto && p.x > CAJA.x && p.x < CAJA.x + CAJA.w && p.y > CAJA.y && p.y < CAJA.y + CAJA.h }
function copiarCodigo() {
  const txt = '.arcade cobrar ' + codigoDe(mejorSesion)
  const ok = () => { copiadoHasta = Date.now() + 1800 }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => { respaldoCopia(txt); ok() })
    else { respaldoCopia(txt); ok() }
  } catch (e) { respaldoCopia(txt); ok() }
  return true
}
function respaldoCopia(txt) {
  try { const a = document.createElement('textarea'); a.value = txt; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove() } catch (e) {}
}
function dibujarCodigo(puntos) {
  if (!boleto) return false
  mejorSesion = Math.max(mejorSesion, Math.floor(puntos))
  x.fillStyle = '#1a1129'; x.strokeStyle = MORADO; x.lineWidth = 1.5
  x.beginPath(); x.roundRect ? x.roundRect(CAJA.x, CAJA.y, CAJA.w, CAJA.h, 10) : x.rect(CAJA.x, CAJA.y, CAJA.w, CAJA.h); x.fill(); x.stroke()
  texto('CÓDIGO PARA NULL · mejor: ' + mejorSesion, W / 2, CAJA.y + 17, 10, GRIS2, '700')
  texto(codigoDe(mejorSesion), W / 2, CAJA.y + 40, 18, '#ffffff', '900')
  texto(Date.now() < copiadoHasta ? '¡Copiado! Pégalo en WhatsApp' : 'toca aquí para copiar', W / 2, CAJA.y + 57, 10, Date.now() < copiadoHasta ? VERDE : CIAN, '700')
  return true
}

const JUEGO = 'ladrillos'
// NULL · Ladrillos
const sRebote = () => tono(420, 380, 'square', 0.04, 0.04)
const sRompe = () => tono(700 + Math.random() * 300, 300, 'triangle', 0.07, 0.07)
const sVida = () => tono(300, 90, 'sawtooth', 0.3, 0.15)
const sNivel = () => { tono(500, 800, 'sine', 0.1, 0.1); setTimeout(() => tono(800, 1200, 'sine', 0.12, 0.1), 90) }
const COLS = 8, BW = 40, BH = 16, GAP = 4, BX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, BY = 90
const COLORES = [ROJO, '#fb923c', ORO, VERDE, CIAN, MORADO, '#ec4899']

let estado = 'menu', t = 0, ultimo = 0, finEn = 0
let pala, bola, ladrillos, chispas, puntos, vidas, nivel, record = leerRecord('ladrillos'), nuevoRecord, pegada, arrastre = null

function armarNivel() {
  ladrillos = []
  const filas = Math.min(4 + nivel, 9)
  for (let f = 0; f < filas; f++) for (let k = 0; k < COLS; k++) {
    const duro = nivel >= 2 && Math.random() < 0.08 * nivel
    ladrillos.push({ x: BX + k * (BW + GAP), y: BY + f * (BH + GAP), vida: duro ? 2 : 1, col: COLORES[f % COLORES.length], pts: (filas - f) * 5 + 5 })
  }
}
function ponerBola() {
  bola = { x: pala.x, y: pala.y - 12, vx: 0, vy: 0, r: 6 }
  pegada = true
}
function reiniciar() {
  pala = { x: W / 2, y: H - 76, w: 74, h: 10, obj: W / 2 }
  chispas = []; puntos = 0; vidas = 3; nivel = 1; nuevoRecord = false
  armarNivel(); ponerBola()
}
reiniciar()

function lanzar() {
  if (!pegada) return
  pegada = false
  const v = 5.2 + nivel * 0.45
  const ang = -Math.PI / 2 + (Math.random() - .5) * 0.6
  bola.vx = Math.cos(ang) * v; bola.vy = Math.sin(ang) * v
}

function estallido(px, py, col) { for (let i = 0; i < 8; i++) chispas.push({ x: px, y: py, vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4, vida: 1, col }) }

function terminar() {
  estado = 'fin'
  if (puntos > record) { record = puntos; nuevoRecord = true; guardarRecord('ladrillos', record) }
  finEn = Date.now() + 700
}

function actualizar(dt) {
  pala.x += (pala.obj - pala.x) * 0.5 * dt
  pala.x = Math.max(pala.w / 2, Math.min(W - pala.w / 2, pala.x))
  if (pegada) { bola.x = pala.x; bola.y = pala.y - 12; return }

  const pasos = 3
  for (let s = 0; s < pasos; s++) {
    bola.x += bola.vx * dt / pasos; bola.y += bola.vy * dt / pasos
    if (bola.x < bola.r) { bola.x = bola.r; bola.vx = Math.abs(bola.vx); sRebote() }
    if (bola.x > W - bola.r) { bola.x = W - bola.r; bola.vx = -Math.abs(bola.vx); sRebote() }
    if (bola.y < 50 + bola.r) { bola.y = 50 + bola.r; bola.vy = Math.abs(bola.vy); sRebote() }

    if (bola.vy > 0 && bola.y + bola.r > pala.y - pala.h / 2 && bola.y < pala.y + pala.h && Math.abs(bola.x - pala.x) < pala.w / 2 + bola.r) {
      const v = Math.hypot(bola.vx, bola.vy)
      const rel = (bola.x - pala.x) / (pala.w / 2)
      const ang = -Math.PI / 2 + Math.max(-1, Math.min(1, rel)) * 1.05
      bola.vx = Math.cos(ang) * v; bola.vy = Math.sin(ang) * v
      bola.y = pala.y - pala.h / 2 - bola.r
      sRebote()
    }

    for (const l of ladrillos) {
      if (l.vida <= 0) continue
      if (bola.x + bola.r > l.x && bola.x - bola.r < l.x + BW && bola.y + bola.r > l.y && bola.y - bola.r < l.y + BH) {
        const solX = Math.min(bola.x + bola.r - l.x, l.x + BW - (bola.x - bola.r))
        const solY = Math.min(bola.y + bola.r - l.y, l.y + BH - (bola.y - bola.r))
        if (solX < solY) bola.vx = -bola.vx; else bola.vy = -bola.vy
        l.vida--
        if (l.vida <= 0) { puntos += l.pts; sRompe(); estallido(l.x + BW / 2, l.y + BH / 2, l.col) }
        else sRebote()
        break
      }
    }
  }

  if (bola.y > H + 20) {
    vidas--; sVida()
    if (vidas <= 0) return terminar()
    ponerBola()
  }

  if (!ladrillos.some(l => l.vida > 0)) {
    nivel++; puntos += 100; sNivel()
    pala.w = Math.max(52, pala.w - 4)
    armarNivel(); ponerBola()
  }
}

function dibujar() {
  x.clearRect(0, 0, W, H)
  dibujarEstrellas()
  ladrillos.forEach(l => {
    if (l.vida <= 0) return
    x.fillStyle = l.col; x.fillRect(l.x, l.y, BW, BH)
    if (l.vida > 1) { x.strokeStyle = '#ffffff'; x.lineWidth = 2; x.strokeRect(l.x + 2, l.y + 2, BW - 4, BH - 4) }
  })
  chispas.forEach(k => { x.globalAlpha = Math.max(k.vida, 0); x.fillStyle = k.col; x.fillRect(k.x, k.y, 3, 3) })
  x.globalAlpha = 1
  if (estado !== 'menu') {
    x.fillStyle = '#ffffff'; x.fillRect(pala.x - pala.w / 2, pala.y - pala.h / 2, pala.w, pala.h)
    x.fillStyle = MORADO; x.fillRect(pala.x - pala.w / 2, pala.y + pala.h / 2 - 3, pala.w, 3)
    x.fillStyle = CIAN; x.beginPath(); x.arc(bola.x, bola.y, bola.r, 0, 7); x.fill()
    texto(String(puntos).padStart(5, '0'), 14, 34, 20, '#ffffff', '900', 'left')
    texto('NIVEL ' + nivel, W / 2, 32, 12, GRIS, '700')
    texto('♥'.repeat(Math.max(vidas, 0)), W - 14, 33, 16, ROJO, '700', 'right')
    if (estado === 'juego' && pegada) texto('Toca para lanzar', W / 2, pala.y + 40, 13, GRIS, '400')
  }
  if (estado === 'menu') pantallaMenu('L A D R I L L O S', ['Arrastra el dedo para mover la barra', 'Toca para lanzar la bola', 'Rompe todos para subir de nivel', 'Los de borde blanco aguantan 2'], record, t)
  if (estado === 'pausa') pantallaPausa()
  if (estado === 'fin') pantallaFin('SIN VIDAS', puntos, 'llegaste al nivel ' + nivel, nuevoRecord, record, Date.now() > finEn, t)
}

function ciclo(ms) {
  if (!ultimo) ultimo = ms
  const dt = Math.min((ms - ultimo) / 16.67, 2)
  ultimo = ms; t += dt
  moverEstrellas(dt, 0.2)
  if (estado === 'juego') actualizar(dt)
  chispas.forEach(k => { k.x += k.vx * dt; k.y += k.vy * dt; k.vida -= 0.04 * dt })
  chispas = chispas.filter(k => k.vida > 0)
  dibujar()
  requestAnimationFrame(ciclo)
}

c.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio()
  const pt = enLienzo(e)
  if (estado === 'fin' && pt && tocaCodigo(pt)) return copiarCodigo()
  if ((estado === 'menu' || estado === 'fin') && tocaVolver(pt)) return volver()
  if (estado === 'menu') { reiniciar(); estado = 'juego'; return }
  if (estado === 'pausa') { estado = 'juego'; ultimo = 0; return }
  if (estado === 'fin') { if (Date.now() > finEn) { reiniciar(); estado = 'juego' } return }
  arrastre = { x0: e.clientX, obj0: pala.obj, movio: false }
  try { c.setPointerCapture(e.pointerId) } catch (er) {}
})
c.addEventListener('pointermove', e => {
  if (!arrastre || estado !== 'juego') return
  const escala = W / c.getBoundingClientRect().width
  const dx = (e.clientX - arrastre.x0) * escala
  if (Math.abs(dx) > 6) arrastre.movio = true
  pala.obj = Math.max(pala.w / 2, Math.min(W - pala.w / 2, arrastre.obj0 + dx * 1.3))
})
c.addEventListener('pointerup', () => { if (arrastre && !arrastre.movio && estado === 'juego') lanzar(); arrastre = null })
c.addEventListener('pointercancel', () => { arrastre = null })
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') pala.obj = Math.max(pala.w / 2, pala.obj - 30)
  if (e.code === 'ArrowRight' || e.code === 'KeyD') pala.obj = Math.min(W - pala.w / 2, pala.obj + 30)
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault(); initAudio()
    if (estado === 'menu' || (estado === 'fin' && Date.now() > finEn)) { reiniciar(); estado = 'juego' }
    else if (estado === 'pausa') { estado = 'juego'; ultimo = 0 }
    else lanzar()
  }
  if (e.code === 'KeyP' && estado === 'juego') estado = 'pausa'
})
document.addEventListener('visibilitychange', () => { if (document.hidden && estado === 'juego') estado = 'pausa' })
requestAnimationFrame(ciclo)
</script>
</body>
</html>
