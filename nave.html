<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0712">
<title>NULL · Nave</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0712; color: #e9e4f5;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #0f0a18; border: 1px solid #2a1f3d; border-radius: 12px; box-shadow: 0 0 40px rgba(139,92,246,.18); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
// NULL · Arcade — utilidades compartidas por todos los juegos
const W = 360, H = 640
const MORADO = '#8b5cf6', CIAN = '#22d3ee', ROJO = '#f43f5e', ROJO2 = '#e11d48', ORO = '#fbbf24', VERDE = '#34d399', GRIS = '#b8b0cc', GRIS2 = '#8a80a6'
const c = document.getElementById('c')
const x = c.getContext('2d')

function ajustar() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98
  const dpr = Math.min(window.devicePixelRatio || 1, 2)
  c.style.width = Math.floor(W * s) + 'px'
  c.style.height = Math.floor(H * s) + 'px'
  c.width = Math.floor(W * s * dpr)
  c.height = Math.floor(H * s * dpr)
  x.setTransform(c.width / W, 0, 0, c.height / H, 0, 0)
}
addEventListener('resize', ajustar)
ajustar()

// Piloto que manda el bot (?n=Nombre)
let piloto = ''
try { piloto = (new URLSearchParams(location.search).get('n') || '').replace(/[\u0000-\u001f]/g, '').slice(0, 18) } catch (e) {}

// Coordenadas del toque dentro del lienzo
function enLienzo(e) {
  const r = c.getBoundingClientRect()
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }
}

function texto(s, px, py, tam, col, peso = '700', alin = 'center') {
  x.font = peso + ' ' + tam + 'px ui-monospace, Menlo, Consolas, monospace'
  x.fillStyle = col; x.textAlign = alin; x.fillText(s, px, py)
}

// Sonido
let actx
function initAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)()
    if (actx.state === 'suspended') actx.resume()
  } catch (e) {}
}
function tono(f1, f2, tipo, dur, vol = 0.08) {
  if (!actx) return
  try {
    const o = actx.createOscillator(), g = actx.createGain()
    o.type = tipo
    o.frequency.setValueAtTime(f1, actx.currentTime)
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime + dur)
    g.gain.setValueAtTime(vol, actx.currentTime)
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur)
    o.connect(g); g.connect(actx.destination)
    o.start(); o.stop(actx.currentTime + dur)
  } catch (e) {}
}

// Récord por juego
function leerRecord(k) { try { return parseInt(localStorage.getItem('null_rec_' + k) || '0', 10) || 0 } catch (e) { return 0 } }
function guardarRecord(k, v) { try { localStorage.setItem('null_rec_' + k, String(Math.floor(v))) } catch (e) {} }

// Botón "← JUEGOS" (abajo, en menú y fin)
const VOLVER = { x: W / 2 - 60, y: H - 62, w: 120, h: 34 }
function dibujarVolver() {
  x.strokeStyle = '#3a2d55'; x.lineWidth = 1.5
  x.beginPath(); x.roundRect ? x.roundRect(VOLVER.x, VOLVER.y, VOLVER.w, VOLVER.h, 8) : x.rect(VOLVER.x, VOLVER.y, VOLVER.w, VOLVER.h); x.stroke()
  texto('← JUEGOS', W / 2, VOLVER.y + 22, 13, GRIS, '700')
}
function tocaVolver(p) { return p.x > VOLVER.x && p.x < VOLVER.x + VOLVER.w && p.y > VOLVER.y && p.y < VOLVER.y + VOLVER.h }
function volver() { location.href = 'index.html' + location.search }

// Fondo de estrellas
const estrellas = []
for (let i = 0; i < 60; i++) estrellas.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.6, vy: 0.6 + Math.random() * 2 })
function moverEstrellas(dt, f = 1) { estrellas.forEach(s => { s.y += s.vy * dt * f; if (s.y > H) { s.y = 0; s.x = Math.random() * W } }) }
function dibujarEstrellas() { estrellas.forEach(s => { x.fillStyle = 'rgba(200,190,255,' + (s.r * 0.22) + ')'; x.fillRect(s.x, s.y, s.r, s.r) }) }

// Pantallas comunes
function pantallaMenu(titulo, lineas, rec, t) {
  x.fillStyle = 'rgba(11,7,18,.6)'; x.fillRect(0, 0, W, H)
  texto('N U L L', W / 2, 190, 34, '#ffffff', '900')
  texto('— ' + titulo + ' —', W / 2, 222, 14, MORADO, '700')
  if (piloto) texto('Piloto: ' + piloto, W / 2, 268, 14, CIAN, '700')
  lineas.forEach((l, i) => texto(l, W / 2, 340 + i * 22, 13, GRIS, '400'))
  if (rec) texto('Tu récord: ' + Math.floor(rec), W / 2, 490, 13, GRIS2, '700')
  if (Math.floor(t / 30) % 2 === 0) texto('TOCA PARA EMPEZAR', W / 2, 535, 16, '#ffffff', '900')
  dibujarVolver()
}
function pantallaFin(titulo, puntos, extra, nuevo, rec, listo, t) {
  x.fillStyle = 'rgba(11,7,18,.82)'; x.fillRect(0, 0, W, H)
  texto(titulo, W / 2, 230, 30, ROJO, '900')
  texto(String(Math.floor(puntos)), W / 2, 295, 44, '#ffffff', '900')
  if (extra) texto(extra, W / 2, 322, 13, GRIS, '400')
  if (nuevo) texto('¡NUEVO RÉCORD!', W / 2, 365, 16, ORO, '900')
  else texto('Récord: ' + Math.floor(rec), W / 2, 365, 13, GRIS2, '700')
  if (listo && Math.floor(t / 30) % 2 === 0) texto('TOCA PARA REINTENTAR', W / 2, 450, 15, '#ffffff', '900')
  dibujarVolver()
}
function pantallaPausa() {
  x.fillStyle = 'rgba(11,7,18,.75)'; x.fillRect(0, 0, W, H)
  texto('PAUSA', W / 2, H / 2 - 10, 28, '#ffffff', '900')
  texto('Toca para seguir', W / 2, H / 2 + 22, 13, GRIS, '400')
}

// Deslizar (para serpiente y 2048)
function alDeslizar(fn) {
  let ini = null
  c.addEventListener('pointerdown', e => { ini = { x: e.clientX, y: e.clientY } })
  c.addEventListener('pointerup', e => {
    if (!ini) return
    const dx = e.clientX - ini.x, dy = e.clientY - ini.y
    ini = null
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return
    if (Math.abs(dx) > Math.abs(dy)) fn(dx > 0 ? 'der' : 'izq')
    else fn(dy > 0 ? 'abajo' : 'arriba')
  })
  addEventListener('keydown', e => {
    const m = { ArrowLeft: 'izq', ArrowRight: 'der', ArrowUp: 'arriba', ArrowDown: 'abajo', KeyA: 'izq', KeyD: 'der', KeyW: 'arriba', KeyS: 'abajo' }
    if (m[e.code]) { e.preventDefault(); fn(m[e.code]) }
  })
}

// NULL · Nave — basado en "Striker" de neoxr-bot (MIT, (c) 2022 Neoxr Creative)
const sDisparo = () => tono(850, 300, 'square', 0.04, 0.03)
const sGolpe = () => tono(300, 80, 'sawtooth', 0.08, 0.07)
const sExplota = () => tono(140, 40, 'sawtooth', 0.22, 0.14)
const sRecoge = () => { tono(650, 900, 'sine', 0.05, 0.1); setTimeout(() => tono(900, 1350, 'sine', 0.08, 0.1), 35) }
const sEscudo = () => { tono(400, 800, 'triangle', 0.12, 0.12); setTimeout(() => tono(800, 1200, 'triangle', 0.1, 0.1), 60) }
const sRompe = () => tono(900, 200, 'triangle', 0.25, 0.15)
const sFin = () => tono(180, 25, 'sawtooth', 0.4, 0.22)

let estado = 'menu'
let p, balas, enemigos, objetos, chispas, puntos, record = leerRecord('nave'), vel, ultimo = 0, sacudida = 0, destello = 0, t = 0, tSpawn, tDisparo, derribos, nuevoRecord, finEn = 0
let izq = false, der = false, arrastre = null

function reiniciar() {
  p = { x: W / 2, y: H - 80, objX: W / 2, triple: 0, escudo: false }
  balas = []; enemigos = []; objetos = []; chispas = []
  puntos = 0; vel = 1; sacudida = 0; destello = 0
  tSpawn = 40; tDisparo = 0; derribos = 0; nuevoRecord = false
  izq = der = false; arrastre = null
}
reiniciar()

function estallido(px, py, n, col, f) {
  for (let i = 0; i < n; i++) chispas.push({ x: px, y: py, vx: (Math.random() - .5) * f, vy: (Math.random() - .5) * f, vida: 1, col, tam: 2 + Math.random() * 2 })
}

function nuevoEnemigo() {
  const r = Math.random()
  let tipo = 'chico'
  if (vel > 1.8 && r < 0.18) tipo = 'cazador'
  else if (r < 0.42) tipo = 'grande'
  const tam = tipo === 'grande' ? 26 : tipo === 'cazador' ? 20 : 16
  enemigos.push({
    tipo, x: 16 + Math.random() * (W - 32 - tam), y: -30, w: tam, h: tam,
    vida: tipo === 'grande' ? 3 : tipo === 'cazador' ? 2 : 1,
    vy: (tipo === 'grande' ? 1.3 : tipo === 'cazador' ? 1.8 : 2.2) + vel * 0.45,
    fase: Math.random() * 10
  })
}

function dibujarNave() {
  x.save(); x.translate(p.x, p.y)
  x.fillStyle = Math.random() < .5 ? CIAN : '#ffffff'
  x.beginPath(); x.moveTo(-5, 12); x.lineTo(0, 20 + Math.random() * 8); x.lineTo(5, 12); x.fill()
  x.fillStyle = '#ffffff'
  x.beginPath(); x.moveTo(0, -14); x.lineTo(14, 13); x.lineTo(0, 8); x.lineTo(-14, 13); x.closePath(); x.fill()
  x.fillStyle = p.triple > 0 ? CIAN : MORADO
  x.beginPath(); x.arc(0, 1, 3.5, 0, 7); x.fill()
  if (p.escudo) {
    x.strokeStyle = 'rgba(251,191,36,' + (0.55 + Math.sin(t * 0.15) * 0.3) + ')'
    x.lineWidth = 2; x.beginPath(); x.arc(0, 0, 22, 0, 7); x.stroke()
  }
  x.restore()
}

function dibujar() {
  x.clearRect(0, 0, W, H)
  x.save()
  if (sacudida > 0) x.translate((Math.random() - .5) * sacudida, (Math.random() - .5) * sacudida)
  dibujarEstrellas()
  x.fillStyle = CIAN
  balas.forEach(b => x.fillRect(b.x - 1.5, b.y - 5, 3, 10))
  objetos.forEach(o => {
    const b = Math.sin(t * 0.1 + o.x) * 2
    if (o.tipo === 'cristal') {
      x.fillStyle = CIAN; x.fillRect(o.x - 5, o.y + b - 5, 10, 10)
      x.fillStyle = '#fff'; x.fillRect(o.x - 2, o.y + b - 2, 4, 4)
    } else {
      x.strokeStyle = ORO; x.lineWidth = 2; x.beginPath(); x.arc(o.x, o.y + b, 7, 0, 7); x.stroke()
      x.fillStyle = ORO; x.fillRect(o.x - 1.5, o.y + b - 1.5, 3, 3)
    }
  })
  enemigos.forEach(e => {
    if (e.tipo === 'grande') {
      x.fillStyle = ROJO2
      x.beginPath(); x.moveTo(e.x + e.w / 2, e.y); x.lineTo(e.x + e.w, e.y + e.h / 2); x.lineTo(e.x + e.w / 2, e.y + e.h); x.lineTo(e.x, e.y + e.h / 2); x.closePath(); x.fill()
    } else if (e.tipo === 'cazador') {
      x.fillStyle = MORADO
      x.beginPath(); x.moveTo(e.x + e.w / 2, e.y + e.h); x.lineTo(e.x + e.w, e.y); x.lineTo(e.x + e.w / 2, e.y + e.h * .35); x.lineTo(e.x, e.y); x.closePath(); x.fill()
    } else { x.fillStyle = ROJO; x.fillRect(e.x, e.y, e.w, e.h) }
    if (e.vida > 1) { x.fillStyle = '#fff'; x.fillRect(e.x + e.w / 2 - 2, e.y + e.h / 2 - 2, 4, 4) }
  })
  chispas.forEach(k => { x.fillStyle = 'rgba(' + k.col + ',' + Math.max(k.vida, 0) + ')'; x.fillRect(k.x, k.y, k.tam, k.tam) })
  if (estado === 'juego' || estado === 'pausa') dibujarNave()
  if (destello > 0) { x.fillStyle = 'rgba(244,63,94,' + (destello * .4) + ')'; x.fillRect(0, 0, W, H) }
  x.restore()

  if (estado !== 'menu') {
    texto(String(Math.floor(puntos)).padStart(5, '0'), 14, 28, 20, '#ffffff', '900', 'left')
    texto('RÉCORD ' + String(Math.floor(record)).padStart(5, '0'), W - 14, 26, 12, GRIS2, '700', 'right')
    if (p.triple > 0) { x.fillStyle = CIAN; x.fillRect(14, 36, Math.min(p.triple / 280, 1) * 70, 3) }
  }
  if (estado === 'menu') pantallaMenu('N A V E', ['Arrastra el dedo para moverte', 'La nave dispara sola', '', 'Cristal azul: disparo triple', 'Aro dorado: escudo de un golpe'], record, t)
  if (estado === 'pausa') pantallaPausa()
  if (estado === 'fin') pantallaFin('DERRIBADO', puntos, 'puntos  ·  ' + derribos + (derribos === 1 ? ' derribo' : ' derribos'), nuevoRecord, record, Date.now() > finEn, t)
}

function terminar() {
  estado = 'fin'; sacudida = 18; destello = 1; sFin()
  if (puntos > record) { record = puntos; nuevoRecord = true; guardarRecord('nave', record) }
  finEn = Date.now() + 700
  estallido(p.x, p.y, 28, '244,63,94', 6); estallido(p.x, p.y, 16, '34,211,238', 4)
}

function actualizar(dt) {
  if (izq) p.objX -= 9 * dt
  if (der) p.objX += 9 * dt
  p.objX = Math.max(18, Math.min(W - 18, p.objX))
  p.x += (p.objX - p.x) * 0.4 * dt
  p.x = Math.max(18, Math.min(W - 18, p.x))
  if (p.triple > 0) p.triple -= dt

  tDisparo -= dt
  if (tDisparo <= 0) {
    tDisparo = p.triple > 0 ? 8 : 11
    sDisparo()
    if (p.triple > 0) {
      balas.push({ x: p.x - 8, y: p.y - 12, vy: -11, vx: -0.6 })
      balas.push({ x: p.x + 8, y: p.y - 12, vy: -11, vx: 0.6 })
      balas.push({ x: p.x, y: p.y - 14, vy: -11, vx: 0 })
    } else balas.push({ x: p.x, y: p.y - 14, vy: -10.5, vx: 0 })
  }
  balas.forEach(b => { b.y += b.vy * dt; b.x += b.vx * dt })
  balas = balas.filter(b => b.y > -20)

  tSpawn -= dt
  if (tSpawn <= 0) { nuevoEnemigo(); tSpawn = Math.max(16, 46 - vel * 10) + Math.random() * 18 }
  enemigos.forEach(e => {
    e.y += e.vy * dt
    if (e.tipo === 'grande') e.x += Math.sin(t * 0.08 + e.fase) * 1.3 * dt
    if (e.tipo === 'cazador') e.x += Math.sign(p.x - (e.x + e.w / 2)) * Math.min(1.1, Math.abs(p.x - (e.x + e.w / 2))) * dt
    e.x = Math.max(0, Math.min(W - e.w, e.x))
  })

  objetos.forEach(o => { o.y += 1.9 * dt })
  objetos.forEach(o => {
    if (!o.tomado && Math.hypot(p.x - o.x, p.y - o.y) < 24) {
      o.tomado = true
      if (o.tipo === 'cristal') { puntos += 100; p.triple = 280; sRecoge(); estallido(o.x, o.y, 8, '34,211,238', 3) }
      else { puntos += 50; p.escudo = true; sEscudo(); estallido(o.x, o.y, 10, '251,191,36', 3) }
    }
  })
  objetos = objetos.filter(o => o.y < H + 20 && !o.tomado)

  balas.forEach(b => {
    enemigos.forEach(e => {
      if (!e.muerto && !b.pego && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
        b.pego = true; e.vida--; sGolpe(); estallido(b.x, b.y, 3, '255,255,255', 2)
        if (e.vida <= 0) {
          e.muerto = true; derribos++
          puntos += e.tipo === 'grande' ? 150 : e.tipo === 'cazador' ? 120 : 50
          sExplota(); sacudida = 7
          estallido(e.x + e.w / 2, e.y + e.h / 2, e.tipo === 'grande' ? 16 : 10, e.tipo === 'cazador' ? '139,92,246' : '244,63,94', 4)
          const r = Math.random()
          if (r < 0.3) objetos.push({ tipo: 'cristal', x: e.x + e.w / 2, y: e.y + e.h / 2 })
          else if (r < 0.36 + (e.tipo === 'grande' ? 0.06 : 0)) objetos.push({ tipo: 'escudo', x: e.x + e.w / 2, y: e.y + e.h / 2 })
        }
      }
    })
  })
  balas = balas.filter(b => !b.pego)
  enemigos = enemigos.filter(e => !e.muerto && e.y < H + 40)

  for (const e of enemigos) {
    if (p.x + 10 > e.x && p.x - 10 < e.x + e.w && p.y + 10 > e.y && p.y - 10 < e.y + e.h) {
      if (p.escudo) {
        p.escudo = false; e.muerto = true; sRompe(); sacudida = 10
        estallido(e.x + e.w / 2, e.y + e.h / 2, 14, '251,191,36', 5)
      } else { terminar(); return }
    }
  }
  enemigos = enemigos.filter(e => !e.muerto)
  vel = Math.min(3.8, vel + 0.0008 * dt)
  puntos += dt * 0.4
}

function ciclo(ms) {
  if (!ultimo) ultimo = ms
  const dt = Math.min((ms - ultimo) / 16.67, 2)
  ultimo = ms; t += dt
  moverEstrellas(dt, estado === 'pausa' ? 0 : 1)
  if (estado === 'juego') actualizar(dt)
  chispas.forEach(k => { k.x += k.vx * dt; k.y += k.vy * dt; k.vida -= 0.04 * dt })
  chispas = chispas.filter(k => k.vida > 0)
  if (sacudida > 0) sacudida = Math.max(0, sacudida - 0.7 * dt)
  if (destello > 0) destello = Math.max(0, destello - 0.05 * dt)
  dibujar()
  requestAnimationFrame(ciclo)
}

function tocar(pt) {
  initAudio()
  if ((estado === 'menu' || estado === 'fin') && pt && tocaVolver(pt)) { volver(); return true }
  if (estado === 'menu') { reiniciar(); estado = 'juego'; return true }
  if (estado === 'pausa') { estado = 'juego'; ultimo = 0; return true }
  if (estado === 'fin') { if (Date.now() > finEn) { reiniciar(); estado = 'juego' } return true }
  return false
}

c.addEventListener('pointerdown', e => {
  e.preventDefault()
  if (tocar(enLienzo(e))) return
  arrastre = { x0: e.clientX, obj0: p.objX }
  try { c.setPointerCapture(e.pointerId) } catch (er) {}
})
c.addEventListener('pointermove', e => {
  if (!arrastre || estado !== 'juego') return
  const escala = W / c.getBoundingClientRect().width
  p.objX = Math.max(18, Math.min(W - 18, arrastre.obj0 + (e.clientX - arrastre.x0) * escala * 1.4))
})
c.addEventListener('pointerup', () => { arrastre = null })
c.addEventListener('pointercancel', () => { arrastre = null })
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { tocar(null); e.preventDefault() }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') izq = true
  if (e.code === 'ArrowRight' || e.code === 'KeyD') der = true
  if (e.code === 'KeyP' && estado === 'juego') estado = 'pausa'
})
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') izq = false
  if (e.code === 'ArrowRight' || e.code === 'KeyD') der = false
})
document.addEventListener('visibilitychange', () => { if (document.hidden && estado === 'juego') estado = 'pausa' })
requestAnimationFrame(ciclo)
</script>
</body>
</html>
