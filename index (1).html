<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0712">
<title>NULL · Arcade</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #0b0712; color: #e9e4f5; font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { background: radial-gradient(ellipse at top, #1a1030 0%, #0b0712 60%) fixed; }
  main { max-width: 440px; margin: 0 auto; padding: 36px 18px 40px; }
  h1 { margin: 0; text-align: center; font-size: 34px; letter-spacing: 12px; font-weight: 900; color: #fff; padding-left: 12px; }
  .sub { text-align: center; color: #8b5cf6; letter-spacing: 6px; font-size: 13px; font-weight: 700; margin-top: 6px; }
  .piloto { text-align: center; color: #22d3ee; font-weight: 700; font-size: 14px; margin-top: 18px; min-height: 18px; }
  .lista { margin-top: 26px; display: grid; gap: 12px; }
  a.juego { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-decoration: none; color: inherit;
    background: #140e22; border: 1px solid #2a1f3d; border-radius: 14px; transition: transform .08s, border-color .15s, background .15s; }
  a.juego:active { transform: scale(.98); }
  a.juego:hover, a.juego:focus-visible { border-color: #8b5cf6; background: #1a1230; outline: none; }
  .icono { width: 46px; height: 46px; flex: none; border-radius: 10px; background: #0f0a18; border: 1px solid #2a1f3d; display: grid; place-items: center; }
  .texto { flex: 1; min-width: 0; }
  .nombre { font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 1px; }
  .desc { font-size: 12px; color: #b8b0cc; margin-top: 3px; }
  .rec { font-size: 11px; color: #8a80a6; text-align: right; flex: none; }
  .rec b { display: block; color: #fbbf24; font-size: 14px; }
  footer { text-align: center; color: #5b5272; font-size: 11px; margin-top: 30px; }
</style>
</head>
<body>
<main>
  <h1>NULL</h1>
  <div class="sub">A R C A D E</div>
  <div class="piloto" id="piloto"></div>
  <div class="lista" id="lista"></div>
  <footer>Elige un juego · tu récord se guarda en este celular</footer>
</main>
<script>
const JUEGOS = [
  { id: 'nave', nombre: 'NAVE', desc: 'Esquiva y dispara', svg: '<svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 3 L23 22 L13 18 L3 22 Z" fill="#fff"/><circle cx="13" cy="14" r="2.5" fill="#8b5cf6"/></svg>' },
  { id: 'serpiente', nombre: 'SERPIENTE', desc: 'Come y crece sin chocar', svg: '<svg width="26" height="26" viewBox="0 0 26 26"><rect x="4" y="14" width="6" height="6" fill="#7c4ddb"/><rect x="10" y="14" width="6" height="6" fill="#8b5cf6"/><rect x="16" y="14" width="6" height="6" fill="#fff"/><circle cx="19" cy="7" r="3" fill="#f43f5e"/></svg>' },
  { id: 'aleteo', nombre: 'ALETEO', desc: 'Toca para volar entre tubos', svg: '<svg width="26" height="26" viewBox="0 0 26 26"><rect x="19" y="0" width="6" height="8" fill="#8b5cf6"/><rect x="19" y="18" width="6" height="8" fill="#8b5cf6"/><circle cx="10" cy="13" r="6" fill="#fff"/><path d="M15 12 L20 13.5 L15 15 Z" fill="#fbbf24"/></svg>' },
  { id: 'ladrillos', nombre: 'LADRILLOS', desc: 'Rompe todos los bloques', svg: '<svg width="26" height="26" viewBox="0 0 26 26"><rect x="2" y="3" width="10" height="5" fill="#f43f5e"/><rect x="14" y="3" width="10" height="5" fill="#fbbf24"/><rect x="2" y="10" width="10" height="5" fill="#34d399"/><circle cx="17" cy="16" r="2.5" fill="#22d3ee"/><rect x="6" y="21" width="14" height="3" fill="#fff"/></svg>' },
  { id: '2048', nombre: '2048', desc: 'Junta números iguales', svg: '<svg width="26" height="26" viewBox="0 0 26 26"><rect x="2" y="2" width="10" height="10" rx="2" fill="#8b5cf6"/><rect x="14" y="2" width="10" height="10" rx="2" fill="#22d3ee"/><rect x="2" y="14" width="10" height="10" rx="2" fill="#38265c"/><rect x="14" y="14" width="10" height="10" rx="2" fill="#fbbf24"/></svg>' }
]
let piloto = ''
try { piloto = (new URLSearchParams(location.search).get('n') || '').replace(/[\u0000-\u001f]/g, '').slice(0, 18) } catch (e) {}
if (piloto) document.getElementById('piloto').textContent = 'Piloto: ' + piloto
const lista = document.getElementById('lista')
JUEGOS.forEach(j => {
  let rec = 0
  try { rec = parseInt(localStorage.getItem('null_rec_' + j.id) || '0', 10) || 0 } catch (e) {}
  const a = document.createElement('a')
  a.className = 'juego'
  a.href = j.id + '.html' + location.search
  a.innerHTML = '<div class="icono">' + j.svg + '</div><div class="texto"><div class="nombre"></div><div class="desc"></div></div>' + (rec ? '<div class="rec">RÉCORD<b></b></div>' : '')
  a.querySelector('.nombre').textContent = j.nombre
  a.querySelector('.desc').textContent = j.desc
  if (rec) a.querySelector('.rec b').textContent = rec
  lista.appendChild(a)
})
</script>
</body>
</html>
